name: tests
on:
  push:
  pull_request:
jobs:
  origin-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install torch numpy pandas scikit-learn
      - run: PYTHONPATH=src python src/test_origin.py
